services:
  backend_api:
    build: ./backend
    container_name: crate_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./shared_data:/app/shared_data
    deploy:
      resources:
        limits:
          memory: 8G

  frontend_ui:
    build: ./frontend
    container_name: crate_frontend
    restart: unless-stopped
    ports:
      - "8050:8050"
    volumes:
      - ./shared_data:/app/shared_data
    depends_on:
      - backend_api